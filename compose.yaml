services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postnaut
      POSTGRES_USER: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: